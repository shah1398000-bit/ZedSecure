name: build-speedchip
on:
  push: { branches: [speedchip] }
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :speedchip:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: speedchip/build/outputs/apk/debug/*.apk }
